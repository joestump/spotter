<!DOCTYPE html>
<html lang="en" data-theme="spotter">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Badge — Spotter</title>
<link rel="stylesheet" href="../../../styles.css" />
<style>
  body { margin: 0; }
  .stage { padding: 40px; display: flex; flex-direction: column; gap: 18px; }
  .stage-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
</style>
</head>
<body class="sp-root">
  <div class="stage">
    <div class="stage-row">
      <span class="sp-badge sp-badge--green">Synced</span>
      <span class="sp-badge sp-badge--violet">AI</span>
      <span class="sp-badge sp-badge--gold">New</span>
      <span class="sp-badge sp-badge--danger">Failed</span>
      <span class="sp-badge sp-badge--neutral">Draft</span>
      <span class="sp-badge sp-badge--soft">42 tracks</span>
    </div>
  </div>
</body>
</html>
