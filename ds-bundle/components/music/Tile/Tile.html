<!-- @dsCard group="Music" name="Tile" subtitle="Album / playlist tile — square art, hover lift, gradient fallback" -->
<!DOCTYPE html>
<html lang="en" data-theme="spotter">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tile — Spotter</title>
<link rel="stylesheet" href="../../../styles.css" />
<style>
  body { margin: 0; }
  .stage { padding: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; background: var(--sp-bg); }
</style>
</head>
<body class="sp-root">
  <div class="stage">
    <a class="sp-card sp-card--hover" style="text-decoration:none">
      <div class="sp-card__body">
        <div class="sp-art">♪</div>
      </div>
      <div class="sp-card__body" style="padding-top:0">
        <div class="sp-card__title">Late Night Drive</div>
        <div class="sp-card__sub">42 tracks · synced</div>
      </div>
    </a>
    <a class="sp-card sp-card--hover" style="text-decoration:none">
      <div class="sp-card__body">
        <div class="sp-art">✦</div>
      </div>
      <div class="sp-card__body" style="padding-top:0">
        <div class="sp-card__title">AI Mixtape <span class="sp-badge sp-badge--violet" style="vertical-align:middle">AI</span></div>
        <div class="sp-card__sub">Generated by Vibes</div>
      </div>
    </a>
    <a class="sp-card sp-card--hover" style="text-decoration:none">
      <div class="sp-card__body">
        <div class="sp-art">◐</div>
      </div>
      <div class="sp-card__body" style="padding-top:0">
        <div class="sp-card__title">Deep Focus</div>
        <div class="sp-card__sub">18 tracks</div>
      </div>
    </a>
  </div>
</body>
</html>
