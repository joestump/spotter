<!-- @dsCard group="Music" name="VibesPanel" subtitle="AI / Vibes surface — violet gradient + ring" -->
<!DOCTYPE html>
<html lang="en" data-theme="spotter">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VibesPanel — Spotter</title>
<link rel="stylesheet" href="../../../styles.css" />
<style>
  body { margin: 0; }
  .stage { padding: 40px; }
</style>
</head>
<body class="sp-root">
  <div class="stage">
    <div class="sp-vibes">
      <div class="sp-row" style="gap:8px; margin-bottom:6px;">
        <span style="font-size:1.2rem">✦</span>
        <span class="sp-h3" style="margin:0">Vibes Engine</span>
        <span class="sp-badge sp-badge--violet">AI</span>
      </div>
      <p class="sp-muted" style="margin:0 0 14px">Generate a mixtape from your listening history with a custom DJ persona.</p>
      <div class="sp-row" style="flex-wrap:nowrap">
        <input class="sp-input" style="flex:1" placeholder="Describe the vibe…" />
        <button class="sp-btn sp-btn--secondary">Create</button>
      </div>
    </div>
  </div>
</body>
</html>
